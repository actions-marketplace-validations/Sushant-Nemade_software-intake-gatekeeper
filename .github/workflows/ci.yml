name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  INTAKE_REQUIRE_GO_FIXTURES: "1"

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.13"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.27.2"
          cache-dependency-path: examples/go-demo/go.sum
      - name: Install uv
        run: python -m pip install uv==0.13.0
      - name: Install frozen dependencies
        run: uv sync --frozen --extra dev --python ${{ matrix.python }}
      - name: Test (real Go binaries for PE, ELF and Mach-O)
        run: uv run --frozen --extra dev pytest -q
      - name: Lint
        run: uv run --frozen --extra dev ruff check .
      - name: Check formatting
        run: uv run --frozen --extra dev ruff format --check .
      - name: Type check
        run: uv run --frozen --extra dev mypy
      - name: Build and check distributions
        run: |
          uv run --frozen --extra dev python -m build
          uv run --frozen --extra dev twine check dist/*
      - name: Action requirements match the lockfile
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt -o "$RUNNER_TEMP/req.txt"
          diff <(grep -v '^#' action-requirements.txt) <(grep -v '^#' "$RUNNER_TEMP/req.txt")
      - name: Audit dependencies
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: uv run --frozen --extra dev pip-audit --local --skip-editable --progress-spinner off

  real-artifacts:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      INTAKE_LIVE_OSV: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Install uv and frozen dependencies
        run: |
          python -m pip install uv==0.13.0
          uv sync --frozen --extra dev --python 3.13
      - name: Install cargo auditable and the reference decoder
        run: cargo install --locked cargo-auditable@0.7.7 rust-audit-info@0.5.4
      - name: Build the Rust fixture with cargo auditable
        working-directory: examples/rust-demo
        run: |
          cargo auditable build --release --locked
          suffix=""
          if [ "$RUNNER_OS" = Windows ]; then suffix=".exe"; fi
          binary="$PWD/target/release/rust-demo$suffix"
          rust-audit-info "$binary" > "$RUNNER_TEMP/audit.json"
          echo "INTAKE_RUST_BINARY=$binary" >> "$GITHUB_ENV"
          echo "INTAKE_RUST_AUDIT_JSON=$RUNNER_TEMP/audit.json" >> "$GITHUB_ENV"
      - name: Pick an Authenticode-signed executable and read Windows' view of it
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = 'C:\Program Files\Git\cmd\git.exe'
          $sig = Get-AuthenticodeSignature $exe
          if ($sig.SignatureType -ne 'Authenticode') { throw "expected an embedded signature, got $($sig.SignatureType)" }
          "INTAKE_SIGNED_EXE=$exe" >> $env:GITHUB_ENV
          "INTAKE_SIGNED_THUMBPRINT=$($sig.SignerCertificate.Thumbprint)" >> $env:GITHUB_ENV
          "INTAKE_SIGNED_CN=$($sig.SignerCertificate.GetNameInfo('SimpleName', $false))" >> $env:GITHUB_ENV
      - name: Enable Maven Central and PyPI checks
        if: runner.os == 'Linux'
        run: echo "INTAKE_LIVE_ARTIFACTS=1" >> "$GITHUB_ENV"
      - name: Real-artifact tests (none may be skipped on its platform)
        run: |
          uv run --frozen --extra dev pytest -q -rA tests/test_real_artifacts.py | tee "$RUNNER_TEMP/real.txt"
          expected=1
          if [ "$RUNNER_OS" != macOS ]; then expected=2; fi
          passed=$(grep -c '^PASSED' "$RUNNER_TEMP/real.txt")
          echo "passed=$passed expected=$expected"
          test "$passed" -eq "$expected"

  dogfood:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.27.2"
          cache-dependency-path: examples/go-demo/go.sum
      - name: Build demo binaries
        run: python scripts/build_demo.py
      - name: Scan the fictional vulnerable demo with the action (live OSV)
        id: gate
        uses: ./
        with:
          path: examples/vulnerable-demo
          fail-on: never
      - name: Expect a rejection with evidence
        env:
          DECISION: ${{ steps.gate.outputs.decision }}
          REPORT: intake-gatekeeper-reports/report.json
          SARIF: ${{ steps.gate.outputs.sarif }}
        run: |
          test "$DECISION" = "reject"
          python - <<'EOF'
          import json, os
          report = json.load(open(os.environ["REPORT"], encoding="utf-8"))
          ids = {f["rule_id"] for f in report["findings"]}
          expected = {"GHSA-69ch-w2m2-3vjp", "GHSA-5crp-9r3c-p9vr", "GHSA-xvch-5gv4-984h",
                      "EGK-JS-NODE-INTEGRATION", "EGK-FUSE-RUN-AS-NODE"}
          missing = expected - ids
          assert not missing, missing
          blocking = [g for g in report["coverage_gaps"] if g["blocking"]]
          assert not blocking, blocking
          sarif = json.load(open(os.environ["SARIF"], encoding="utf-8"))
          uris = {r["locations"][0]["physicalLocation"]["artifactLocation"]["uri"]
                  for r in sarif["runs"][0]["results"]}
          assert all(u.startswith("examples/vulnerable-demo/") for u in uris), uris
          print(report["summary"])
          EOF
      - name: Gate fails the step when the decision meets fail-on
        id: strict
        continue-on-error: true
        uses: ./
        with:
          path: examples/vulnerable-demo
          osv: "false"
          output-dir: strict-reports
      - name: Invalid input is rejected
        id: invalid
        continue-on-error: true
        uses: ./
        with:
          path: examples/vulnerable-demo
          osv: "yes"
          output-dir: invalid-reports
      - name: Expect failures from the strict and invalid runs
        env:
          STRICT: ${{ steps.strict.outcome }}
          STRICT_DECISION: ${{ steps.strict.outputs.decision }}
          INVALID: ${{ steps.invalid.outcome }}
        run: |
          test "$STRICT" = "failure"
          test "$STRICT_DECISION" = "reject"
          test "$INVALID" = "failure"
      - name: Compare two versions with the action (live OSV)
        id: update
        uses: ./
        with:
          path: examples/update-demo/v2
          compare-to: examples/update-demo/v1
          fail-on: never
          output-dir: update-reports
      - name: Expect the update to be rejected for what it adds
        env:
          DECISION: ${{ steps.update.outputs.decision }}
        run: |
          test "$DECISION" = "reject"
          python - <<'EOF'
          import json, pathlib
          diff = json.loads(pathlib.Path("update-reports/report.json").read_text(encoding="utf-8"))
          assert diff["schema"] == "software-intake-gatekeeper/diff/v1"
          assert diff["endpoints"]["added"] == ["collect.metrics-collector.example"], diff["endpoints"]
          assert diff["binaries"]["added"] == ["resources/app/node_modules/fast-native/build/Release/addon.node"]
          new = {f["rule_id"] for f in diff["findings"]["new"]}
          resolved = {f["rule_id"] for f in diff["findings"]["resolved"]}
          assert "GHSA-cph5-m8f7-6c5x" in new, new
          assert {"GHSA-p6mc-m468-83gw", "EGK-JS-NODE-INTEGRATION"} <= resolved, resolved
          print(diff["decision"])
          EOF
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: demo-intake-reports-${{ matrix.os }}
          path: |
            intake-gatekeeper-reports/
            update-reports/
          retention-days: 14

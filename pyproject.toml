[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "software-intake-gatekeeper"
version = "0.3.0"
description = "Local, evidence-first intake checks for third-party apps and binaries: SBOM (Go, Rust, npm, NuGet, Python, Maven), known vulnerabilities, Electron hardening and code-signing changes."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Sushant Nemade" }]
keywords = ["sbom", "cyclonedx", "sarif", "osv", "electron", "supply-chain", "security", "cargo-auditable", "maven", "authenticode"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.28,<1",
    "truststore>=0.10",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "cryptography>=44",
    "cyclonedx-python-lib[json-validation]>=9",
    "mypy>=1.13",
    "pip-audit>=2.7",
    "pytest>=8.3",
    "ruff>=0.8",
    "twine>=6",
]

[project.scripts]
intake-gatekeeper = "intake_gatekeeper.cli:main"

[project.urls]
Homepage = "https://github.com/Sushant-Nemade/software-intake-gatekeeper"
Source = "https://github.com/Sushant-Nemade/software-intake-gatekeeper"
Changelog = "https://github.com/Sushant-Nemade/software-intake-gatekeeper/blob/main/CHANGELOG.md"
Issues = "https://github.com/Sushant-Nemade/software-intake-gatekeeper/issues"
"GitHub Marketplace" = "https://github.com/marketplace/actions/software-intake-gatekeeper"

[tool.hatch.build.targets.wheel]
packages = ["src/intake_gatekeeper"]

[tool.hatch.build.targets.sdist]
include = [
    "src",
    "tests",
    "examples",
    "action.yml",
    "action-requirements.txt",
    "README.md",
    "CHANGELOG.md",
    "SECURITY.md",
    "LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "C4"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S603", "S607"]
"scripts/**" = ["S603", "S607"]

[tool.mypy]
strict = true
files = ["src"]
python_version = "3.11"

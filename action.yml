name: Software Intake Gatekeeper
description: "Read-only intake gate for apps and binaries: CycloneDX SBOM, OSV vulnerabilities, Electron hardening and SARIF."
author: Sushant Nemade
branding:
  icon: shield
  color: blue

inputs:
  path:
    description: Installed app directory, .asar archive or executable to scan.
    required: true
  compare-to:
    description: Optional previous version of the same app. When set, the action gates the update on what it adds.
    default: ""
  osv:
    description: Look up known vulnerabilities on OSV.dev. Sends only ecosystem, name and version of each component.
    default: "true"
  policy:
    description: Optional policy TOML file.
    default: ""
  fail-on:
    description: Decision that fails the step (reject, review or never).
    default: reject
  output-dir:
    description: Directory for report.json, report.sarif, sbom.cdx.json and summary.md.
    default: intake-gatekeeper-reports

outputs:
  decision:
    description: approve, review or reject (error if no report was produced).
    value: ${{ steps.scan.outputs.decision }}
  sarif:
    description: Path to the SARIF report.
    value: ${{ steps.scan.outputs.sarif }}
  sbom:
    description: Path to the CycloneDX SBOM.
    value: ${{ steps.scan.outputs.sbom }}

runs:
  using: composite
  steps:
    - id: python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: "3.13"
        update-environment: false

    - id: scan
      shell: bash
      env:
        PYTHON: ${{ steps.python.outputs.python-path }}
        ACTION_PATH: ${{ github.action_path }}
        INPUT_PATH: ${{ inputs.path }}
        INPUT_COMPARE_TO: ${{ inputs.compare-to }}
        INPUT_OSV: ${{ inputs.osv }}
        INPUT_POLICY: ${{ inputs.policy }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        OUTPUT_DIR: ${{ inputs.output-dir }}
      run: |
        set -u
        case "$INPUT_OSV" in
          true|false) ;;
          *) echo "::error title=Software Intake Gatekeeper::input 'osv' must be 'true' or 'false'"; exit 2 ;;
        esac
        venv="$RUNNER_TEMP/intake-gatekeeper-venv"
        "$PYTHON" -m venv "$venv"
        if [ -x "$venv/bin/python" ]; then py="$venv/bin/python"; else py="$venv/Scripts/python.exe"; fi
        "$py" -m pip install --disable-pip-version-check --quiet --require-hashes --no-deps \
          -r "$ACTION_PATH/action-requirements.txt"
        mkdir -p "$OUTPUT_DIR"
        if [ -n "$INPUT_COMPARE_TO" ]; then
          args=(diff "$INPUT_COMPARE_TO" "$INPUT_PATH")
        else
          args=(scan "$INPUT_PATH")
        fi
        args+=(--fail-on "$INPUT_FAIL_ON"
          --json "$OUTPUT_DIR/report.json" --sarif "$OUTPUT_DIR/report.sarif"
          --cyclonedx "$OUTPUT_DIR/sbom.cdx.json" --markdown "$OUTPUT_DIR/summary.md")
        if [ "$INPUT_OSV" = "true" ]; then args+=(--osv); fi
        if [ -n "$INPUT_POLICY" ]; then args+=(--policy "$INPUT_POLICY"); fi
        set +e
        PYTHONPATH="$ACTION_PATH/src" "$py" -m intake_gatekeeper "${args[@]}"
        status=$?
        set -e
        if [ -f "$OUTPUT_DIR/summary.md" ]; then cat "$OUTPUT_DIR/summary.md" >> "$GITHUB_STEP_SUMMARY"; fi
        decision=$("$py" -c 'import json,sys; print(json.load(open(sys.argv[1]))["decision"]["value"])' \
          "$OUTPUT_DIR/report.json" 2>/dev/null || echo error)
        {
          echo "decision=$decision"
          echo "sarif=$OUTPUT_DIR/report.sarif"
          echo "sbom=$OUTPUT_DIR/sbom.cdx.json"
        } >> "$GITHUB_OUTPUT"
        exit "$status"
